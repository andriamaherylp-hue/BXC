# Optional Blueprint for a NEW environment only.
# Do not use this file against an existing Render service unless you intend to create new resources.
services:
  - type: web
    name: www-edcsxc
    runtime: python
    buildCommand: bash ./build.sh
    startCommand: cd backend && gunicorn dxc_project.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: ALLOWED_HOSTS
        value: www-edcsxc.onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://www-edcsxc.onrender.com
      - key: SMS_BACKEND
        value: console
      - key: DATABASE_URL
        fromDatabase:
          name: dxc-db
          property: connectionString

databases:
  - name: dxc-db
