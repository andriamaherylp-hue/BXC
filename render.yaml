# Optional Blueprint for a NEW BXC environment.
# If www-edcsxc already exists, configure it manually with the same values below.
services:
  - type: web
    name: www-edcsxc
    runtime: python
    buildCommand: bash ./build.sh
    preDeployCommand: bash ./predeploy.sh
    startCommand: cd backend && gunicorn dxc_project.wsgi:application --bind 0.0.0.0:$PORT --workers ${WEB_CONCURRENCY:-2} --timeout 120
    healthCheckPath: /health/
    autoDeployTrigger: commit
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "0"
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: bxc-db
          property: connectionString

databases:
  - name: bxc-db
    databaseName: bxc
    user: bxc
